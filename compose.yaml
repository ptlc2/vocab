services:
  server:
    build: server
    environment:
      POSTGRES_HOSTNAME: database
      POSTGRES_USERNAME: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DBNAME: vocab
      BASE_PATH: ${BASE_PATH-/vocab}
      LANGUAGES: ${LANGUAGES:-fr}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
    ports:
      - 80
    restart: always
    labels:
      - webproxy.path=vocab
    depends_on:
      - database
    develop:
      watch:
        - action: rebuild
          path: server
          ignore:
            - views/
        - action: sync
          path: server/views
          target: /app/views
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vocab
    volumes:
      - database_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    #     - ./database/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro
    ports:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database_data:
